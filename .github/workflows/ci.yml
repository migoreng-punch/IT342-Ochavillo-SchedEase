name: Full Stack CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # --------------------------------------------------------
  # 1. SPRING BOOT BACKEND
  # --------------------------------------------------------
  backend-spring:
    name: Build Spring Boot 3.5.11
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build and Test Backend
        working-directory: ./backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

  # --------------------------------------------------------
  # 2. REACT FRONTEND (web)
  # --------------------------------------------------------
  frontend-react:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json' # <-- Fixed path

      - name: Install Dependencies
        working-directory: ./web # <-- Fixed path
        run: npm ci

      - name: Run ESLint
        working-directory: ./web # <-- Fixed path
        run: npx eslint .

      - name: Build Vite Project
        working-directory: ./web # <-- Fixed path
        run: npm run build

  # --------------------------------------------------------
  # 3. ANDROID (mobile)
  # --------------------------------------------------------
  mobile-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android Environment
        uses: android-actions/setup-android@v3

      # Using your defined Kotlin 1.9.0 configuration to prevent build mismatches
      - name: Build Android APK (Debug)
        working-directory: ./mobile # <-- Fixed path
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ./mobile/app/build/outputs/apk/debug/app-debug.apk # <-- Fixed path
          retention-days: 7